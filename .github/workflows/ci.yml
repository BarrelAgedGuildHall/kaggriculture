name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync environment
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Smoke -- one episode, agent vs random
        run: uv run python scripts/run_episode.py --seed 0 --no-save
